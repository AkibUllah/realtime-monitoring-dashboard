services:
  backend:
    build: ./backend
    environment:
      FLEET_SIZE: ${FLEET_SIZE:-8}
      COLLECT_INTERVAL_SECONDS: ${COLLECT_INTERVAL_SECONDS:-2}
      RING_CAPACITY: 1800
      SQLITE_PATH: /app/data/metrics.db
      HOST_COLLECTOR_ENABLED: "true"
      CORS_ORIGINS: http://localhost:8080
    volumes:
      - metrics-data:/app/data
    expose:
      - "8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    expose:
      - "80"

  proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    ports:
      - "8080:80"

volumes:
  metrics-data:

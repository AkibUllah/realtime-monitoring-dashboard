[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "monitoring-backend"
version = "0.1.0"
description = "Real-time infrastructure monitoring API: collectors, ring-buffer store, alerts, WebSocket stream"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Akib Jafor" }]
dependencies = [
  "fastapi>=0.115,<0.161",
  "uvicorn[standard]>=0.32,<0.33",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "psutil>=6.0,<8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "httpx>=0.27,<0.29",
  "ruff>=0.6,<0.18",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
